create_schedule:
  name: Create schedule
  description: Create a new simple schedule.
  fields:
    name:
      required: true
      example: Classroom hours
      selector:
        text:
    object_id:
      selector:
        text:
    enabled:
      default: true
      selector:
        boolean:
    weekdays:
      selector:
        select:
          multiple: true
          options:
            - sun
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
    windows:
      selector:
        object:
    group_id:
      selector:
        text:

update_schedule:
  name: Update schedule
  description: Update an existing schedule by id.
  fields:
    schedule_id:
      required: true
      selector:
        text:
    name:
      selector:
        text:
    enabled:
      selector:
        boolean:
    weekdays:
      selector:
        select:
          multiple: true
          options: [sun, mon, tue, wed, thu, fri, sat]
    windows:
      selector:
        object:

delete_schedule:
  name: Delete schedule
  fields:
    schedule_id:
      required: true
      selector:
        text:

set_enabled:
