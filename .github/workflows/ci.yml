name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Import modules + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import every companion module
        run: |
          python -m unittest -v tests.simple_schedule.test_import_all_modules

      - name: Run offline Simple Schedule tests
        run: |
          python -m unittest -v tests.simple_schedule.test_simple_schedule_logic

      - name: Runtime action sequencing + storage saves
        run: |
          python -m unittest -v tests.simple_schedule.test_runtime

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build minified Lovelace card
        run: |
          ./scripts/build-card.sh
          git diff --exit-code -- custom_components/simple_schedule/www/simple-schedule-card.js

      - name: Card schedule Edit open/close + wait helpers
        run: |
          python -m unittest -v tests.simple_schedule.test_card_schedule_edit

      - name: Card editor optional entity + group visual editor
        run: |
          python -m unittest -v tests.simple_schedule.test_card_editor_optional_entity
